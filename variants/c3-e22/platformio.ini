[C3_E22]
extends = esp32_base
board_build.partitions = min_spiffs.csv ; get around 4mb flash limit
board = esp32-c3-devkitm-1
build_flags =
  ${esp32_base.build_flags}
  -I variants/c3-e22
  -D C3_E22
  -D ESP32_CPU_FREQ=80
#  -D P_LORA_TX_LED=8
  -D PIN_VBAT_READ=2
  -D P_LORA_DIO_1=3
  -D P_LORA_RESET=20
  -D P_LORA_BUSY=10
#  -D P_LORA_SCLK=4
  -D P_LORA_MOSI=6
  -D P_LORA_MISO=5
  -D P_LORA_NSS=7
  -D SX126X_TXEN=0
  -D SX126X_RXEN=1
  -D PIN_BOARD_SDA=8
  -D PIN_BOARD_SCL=9
#  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=10
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/c3-e22>
lib_deps =
  ${esp32_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13

[env:C3_E22_sx1262_repeater]
extends = C3_E22
build_src_filter = ${C3_E22.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${C3_E22.build_flags}
  -D ADVERT_NAME='"E22 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
  -D MESH_DEBUG=1
  -D RADIOLIB_VERBOSE_ASSERT=1
  -D RADIOLIB_DEBUG_BASIC=1
lib_deps =
  ${C3_E22.lib_deps}
  ${esp32_ota.lib_deps}
